name: Build & Release (all platforms)

# v* 태그를 push하면 전체 OS 빌드 후 릴리스 생성
# 예: git tag v1.0.0 && git push origin v1.0.0
# 수동 실행(workflow_dispatch)도 가능 — 이 경우 릴리스는 만들지 않고 아티팩트만 업로드
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.6'
  APP_DIR: ubf_app
  # 모든 플랫폼 빌드에 넘긴다. 빠뜨리면 app_constants.dart 의 기본값인
  # http://localhost:3000 이 박혀서, 설치한 기기가 자기 자신에게 붙으려 하다
  # 아무것도 못 한다. 실제로 다섯 플랫폼 모두 이 값이 빠져 있었다.
  API_BASE_URL: https://ubf.coolsistema.com/api

jobs:
  # ---------------------------------------------------------------- Web
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build web
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Zip web
        working-directory: ${{ env.APP_DIR }}/build/web
        run: zip -r "$GITHUB_WORKSPACE/mana-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: mana-web
          path: mana-web.zip

  # ---------------------------------------------------------------- Android APK
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        # API_BASE_URL 을 반드시 넘긴다. 없으면 app_constants.dart 의 기본값인
        # http://localhost:3000 이 박혀서, 설치한 기기에서 자기 자신에게 붙으려
        # 하다 아무것도 못 한다. 웹은 같은 도메인이라 /api 로 충분하지만
        # 앱은 절대 주소가 필요하다.
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Rename APK
        run: cp "${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk" mana-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mana-android
          path: mana-android.apk

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Windows
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          # 이 잡은 pwsh 로 돈다. PowerShell 에서 백슬래시는 줄 연결이 아니라
          # "Missing expression after unary operator '--'" 로 깨진다. 한 줄로 둔다.
          flutter build windows --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Zip Windows (portable)
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.APP_DIR }}\build\windows\x64\runner\Release\*" -DestinationPath "mana-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mana-windows
          path: mana-windows.zip
      # 설치 파일(setup.exe) — Inno Setup으로 컴파일
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer (setup.exe)
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)') { $ver = $Matches[1] }
          Write-Host "Installer version: $ver"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=${{ github.workspace }}\${{ env.APP_DIR }}\build\windows\x64\runner\Release" `
            "/DMyAppVersion=$ver" `
            "${{ github.workspace }}\${{ env.APP_DIR }}\installer\mana.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: mana-windows-setup
          path: ${{ env.APP_DIR }}/installer/mana-setup.exe

  # ---------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          # libsecret-1-dev 는 flutter_secure_storage_linux 가 요구한다.
          # 빠지면 CMake 가 "libsecret-1>=0.18.4 not found" 로 멈춘다.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Linux
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build linux --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Tar Linux bundle
        working-directory: ${{ env.APP_DIR }}/build/linux/x64/release/bundle
        run: tar czf "$GITHUB_WORKSPACE/mana-linux.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: mana-linux
          path: mana-linux.tar.gz

  # ---------------------------------------------------------------- macOS DMG
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build macOS
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build macos --release \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Create DMG
        working-directory: ${{ env.APP_DIR }}
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          STAGE=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "mana" -srcfolder "$STAGE" -ov -format UDZO "$GITHUB_WORKSPACE/mana-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mana-macos
          path: mana-macos.dmg

  # ---------------------------------------------------------------- Release
  release:
    needs: [web, android, windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
