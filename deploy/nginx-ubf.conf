# ubf.coolsistema.com — 웹(정적) + API(프록시)
#
# 서버에 넣을 때 파일 이름은 **ubf.coolsistema.com.conf** 다(끝의 .conf 포함).
# sites-enabled 의 심볼릭 링크가 그 이름을 가리킨다. 다른 이름으로 복사하면
# nginx -t 는 통과하지만 **쓰이지 않는 설정을 검사한 것**이라 아무것도
# 바뀌지 않는다. 실제로 그렇게 한 번 속았다.
#
#   scp deploy/nginx-ubf.conf deploy@62.72.7.245:/tmp/
#   sudo cp /tmp/nginx-ubf.conf /etc/nginx/sites-available/ubf.coolsistema.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 이 서버에는 다른 서비스가 여럿 돌고 있다. 이 파일은 ubf 도메인만 다루며
# 기존 vhost·인증서·Docker 컨테이너는 건드리지 않는다.
#
# 웹과 API 를 같은 origin 에 둔다:
#   /      → 정적 파일 (Flutter web 빌드)
#   /api/  → 127.0.0.1:3100 (Node API)
# 이렇게 하면 CORS 가 필요 없고 구글 OAuth 승인 원본도 하나면 된다.

server {
    listen 80;
    listen [::]:80;
    server_name ubf.coolsistema.com;

    # certbot 이 갱신할 때 쓰는 경로만 평문으로 열어둔다
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 는 `http2 on;` 지시자를 모른다(1.25 부터). listen 에 붙인다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ubf.coolsistema.com;

    # ubf 전용 인증서. 기존 coolsistema 인증서와 분리되어 있어
    # 갱신이 실패해도 다른 13개 사이트에 영향이 없다.
    ssl_certificate     /etc/letsencrypt/live/ubf.coolsistema.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubf.coolsistema.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/ubf/web;
    index index.html;

    # 보안 헤더. API 응답 헤더는 서버(helmet)가 붙이고,
    # 여기서는 정적 문서에 필요한 것을 붙인다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 수양회 교재 PDF 가 가장 크다(서버는 12MB 까지 받는다).
    # 여기가 더 작으면 nginx 가 먼저 413 을 내고, 서버의 안내 문구는
    # 사용자에게 닿지 않는다.
    client_max_body_size 16m;

    # ── API ──────────────────────────────────────────────────
    # /api/ 를 벗겨서 넘긴다: /api/health → 127.0.0.1:3100/health
    location /api/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 서버가 trust proxy 로 실제 클라이언트 IP 를 읽는다.
        # 없으면 레이트 리밋이 모든 요청을 프록시 IP 하나로 묶어 무력해진다.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 올린 이미지 ───────────────────────────────────────────
    # 수양회 사진·명함 사진. 배포(rsync --delete)는 web/ 만 건드리므로
    # 이 폴더는 배포해도 살아남는다.
    #
    # location / 의 try_files 가 없는 파일을 index.html 로 넘기기 때문에,
    # 여기서 먼저 잡아 404 를 제대로 돌려준다 — 안 그러면 깨진 사진 자리에
    # HTML 이 와서 원인을 찾기 어렵다.
    location /media/ {
        # alias 가 아니라 root 를 쓴다.
        #
        # alias + try_files $uri 는 $uri 를 alias 기준으로 풀지 않아서,
        # 없는 파일이 아래 location / 의 try_files 로 떨어져 index.html 이
        # 200 으로 나간다. 깨진 사진 자리에 HTML 이 오면 원인을 찾기 어렵다.
        # root 로 두면 /media/x.jpg → /srv/ubf/media/x.jpg 로 그대로 맞는다.
        root /srv/ubf;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        # 올라온 파일이 다른 타입으로 해석되지 않게 한다.
        add_header X-Content-Type-Options "nosniff" always;
        # 이 아래에서는 어떤 것도 실행되지 않는다(정적 서빙만).
    }

    # ── 정적 파일 ─────────────────────────────────────────────
    # Flutter 웹은 해시 라우팅을 쓰지만, 새로고침·직접 진입을 위해
    # 못 찾은 경로는 index.html 로 넘긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 산출물은 파일명이 바뀌지 않으므로 캐시를 짧게 둔다.
    # 서비스 워커를 쓰지 않기로 했으므로(--pwa-strategy=none) 여기서만 제어한다.
    location ~* \.(js|wasm|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(png|jpg|jpeg|gif|svg|ico|ttf|otf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
